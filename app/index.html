<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>Dream Spirits — Barrel Pick Ops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              noir: {
                DEFAULT: "#050505",
                50: "#141414",
                100: "#0d0d0d",
              },
              gold: {
                DEFAULT: "#c9a86a",
                light: "#e4cd9a",
                dark: "#9c7d45",
              },
              ivory: "#f3ede0",
            },
            fontFamily: {
              serif: ['"Cormorant Garamond"', "Georgia", "serif"],
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* Taps register immediately instead of waiting to see if it's a double-tap zoom. */
      button,
      a,
      select,
      input,
      label {
        touch-action: manipulation;
      }
      body {
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
        background-color: #050505;
        color: #f3ede0;
      }

      /* ---- Ambient background: soft drifting light, fixed behind everything ---- */
      .ambient-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        background: #050505;
      }
      .ambient-bg::before,
      .ambient-bg::after {
        content: "";
        position: absolute;
        width: 60vw;
        height: 60vw;
        border-radius: 9999px;
        filter: blur(120px);
        opacity: 0.14;
      }
      .ambient-bg::before {
        top: -15vw;
        left: -10vw;
        background: radial-gradient(circle, #6b6b6b 0%, transparent 70%);
        animation: drift1 28s ease-in-out infinite alternate;
      }
      .ambient-bg::after {
        bottom: -20vw;
        right: -15vw;
        background: radial-gradient(circle, #c9a86a 0%, transparent 70%);
        opacity: 0.12;
        animation: drift2 34s ease-in-out infinite alternate;
      }
      @keyframes drift1 {
        to {
          transform: translate(8vw, 6vw) scale(1.1);
        }
      }
      @keyframes drift2 {
        to {
          transform: translate(-6vw, -8vw) scale(1.05);
        }
      }

      /* ---- Liquid glass surfaces ---- */
      .glass {
        position: relative;
        background: linear-gradient(155deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.015));
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .glass-strong {
        background: linear-gradient(155deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        border: 1px solid rgba(201, 168, 106, 0.25);
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
      /* Pointer-tracked sheen — glass-glare elements set --mx/--my via JS on pointermove */
      .glass-glare::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(
          380px circle at var(--mx, 50%) var(--my, 0%),
          rgba(255, 255, 255, 0.14),
          transparent 60%
        );
        opacity: 0;
        transition: opacity 0.35s ease;
        pointer-events: none;
      }
      .glass-glare:hover::before {
        opacity: 1;
      }

      /* ---- Reveal-on-scroll ---- */
      .reveal {
        opacity: 0;
        transform: translateY(24px);
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .reveal-in {
        opacity: 1;
        transform: translateY(0);
      }

      /* ---- Phones ---- */
      /* iOS Safari zooms the whole page when a focused field's text is under
         16px; keep fields at 16px on small screens so tapping one doesn't. */
      @media (max-width: 639px) {
        input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
        select,
        textarea {
          font-size: 16px !important;
        }
      }

      /* ---- Scrollbar ---- */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(201, 168, 106, 0.25);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(201, 168, 106, 0.4);
      }

      ::selection {
        background: rgba(201, 168, 106, 0.35);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="ambient-bg"></div>
    <div id="app" class="relative z-10"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
